<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochame Screen Mirror</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Screen Container - True Big Screen */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overflow: hidden;
    }

    #stage.mode-actual {
      overflow: auto;
      display: block;
    }

    #screen-stream {
      display: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: auto;
    }

    /* Mode: Fit to window (Maximized Big Screen) */
    #stage.mode-fit #screen-stream {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    /* Mode: 1:1 Native Resolution */
    #stage.mode-actual #screen-stream {
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      display: block;
      margin: auto;
    }

    /* Waiting / Offline Splash Screen */
    #empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #64748b;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      z-index: 10;
    }

    .pulse-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #empty-state h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #94a3b8;
    }

    #empty-state p {
      font-size: 0.85rem;
      color: #475569;
      max-width: 320px;
      line-height: 1.5;
    }

    /* Floating Autohiding Controls Bar */
    #floating-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
    }

    #floating-bar.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
      pointer-events: none;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .status-badge.live .dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-badge.offline .dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.live { color: #10b981; }
    .status-badge.waiting { color: #f59e0b; }
    .status-badge.offline { color: #ef4444; }

    .info-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: monospace;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Buttons */
    .bar-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .bar-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .bar-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    /* Hide cursor when idle */
    body.idle-cursor {
      cursor: none;
    }
  </style>
</head>
<body>

  <!-- Floating Auto-hiding Controller -->
  <div id="floating-bar">
    <div id="statusBadge" class="status-badge waiting">
      <span class="dot"></span>
      <span id="statusLabel">Connecting...</span>
    </div>

    <div class="divider"></div>

    <span id="resTag" class="info-tag">Waiting for stream</span>
    <span id="fpsTag" class="info-tag">0s update</span>

    <div class="divider"></div>

    <button id="btnFit" class="bar-btn active" onclick="setMode('fit')" title="Fit screen to window">
      Fit Screen
    </button>
    <button id="btnActual" class="bar-btn" onclick="setMode('actual')" title="100% native pixel-for-pixel size">
      1:1 Native
    </button>
    <button class="bar-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
      ⛶ Fullscreen
    </button>
    <button class="bar-btn" onclick="saveSnapshot()" title="Save current screenshot (S)">
      📸 Save
    </button>
  </div>

  <!-- Big Screen Stage -->
  <main id="stage" class="mode-fit" ondblclick="toggleFullscreen()">
    <div id="empty-state">
      <div class="pulse-ring"></div>
      <h2>Waiting for Screen Stream</h2>
      <p>Ensure the Prochame desktop app is running to transmit live screen frames in full clarity.</p>
    </div>
    <img id="screen-stream" src="" alt="Live Screen Stream" />
  </main>

  <script>
    const socket = io(window.location.origin, {
      transports: ['websocket', 'polling'],
      reconnectionDelay: 1000
    });

    const stage = document.getElementById('stage');
    const screenImg = document.getElementById('screen-stream');
    const emptyState = document.getElementById('empty-state');
    const floatingBar = document.getElementById('floating-bar');
    const statusBadge = document.getElementById('statusBadge');
    const statusLabel = document.getElementById('statusLabel');
    const resTag = document.getElementById('resTag');
    const fpsTag = document.getElementById('fpsTag');
    const btnFit = document.getElementById('btnFit');
    const btnActual = document.getElementById('btnActual');

    let lastFrameTime = Date.now();
    let hideTimer = null;

    // Socket listeners
    socket.on('connect', () => {
      statusBadge.className = 'status-badge waiting';
      statusLabel.textContent = 'Connected (Waiting)';
      socket.emit('register:role', 'driver');
    });

    socket.on('disconnect', () => {
      statusBadge.className = 'status-badge offline';
      statusLabel.textContent = 'Disconnected';
      fpsTag.textContent = 'Offline';
    });

    socket.on('connect_error', () => {
      statusBadge.className = 'status-badge offline';
      statusLabel.textContent = 'Connection Error';
    });

    socket.on('driver:screen-frame', (dataUrl) => {
      if (!dataUrl) return;

      const now = Date.now();
      const deltaSec = ((now - lastFrameTime) / 1000).toFixed(1);
      lastFrameTime = now;

      if (screenImg.style.display !== 'block') {
        screenImg.style.display = 'block';
        emptyState.style.display = 'none';
      }

      screenImg.src = dataUrl;

      statusBadge.className = 'status-badge live';
      statusLabel.textContent = 'LIVE';
      fpsTag.textContent = `${deltaSec}s interval`;
    });

    screenImg.onload = () => {
      resTag.textContent = `${screenImg.naturalWidth} × ${screenImg.naturalHeight}`;
    };

    // Mode Toggle: Fit vs 1:1
    function setMode(mode) {
      if (mode === 'fit') {
        stage.className = 'mode-fit';
        btnFit.classList.add('active');
        btnActual.classList.remove('active');
      } else {
        stage.className = 'mode-actual';
        btnActual.classList.add('active');
        btnFit.classList.remove('active');
      }
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen();
      }
    }

    // Save Screenshot
    function saveSnapshot() {
      if (!screenImg.src || screenImg.style.display === 'none') {
        alert('No screen stream available.');
        return;
      }
      const a = document.createElement('a');
      a.href = screenImg.src;
      a.download = `screen-mirror-${Date.now()}.jpg`;
      a.click();
    }

    // Auto-hide floating bar on mouse inactivity (like video players)
    function resetHideTimer() {
      floatingBar.classList.remove('hidden');
      document.body.classList.remove('idle-cursor');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        floatingBar.classList.add('hidden');
        document.body.classList.add('idle-cursor');
      }, 2500);
    }

    window.addEventListener('mousemove', resetHideTimer);
    window.addEventListener('mousedown', resetHideTimer);
    resetHideTimer();

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === '0') {
        setMode('fit');
      } else if (e.key === '1') {
        setMode('actual');
      } else if (e.key === 's' || e.key === 'S') {
        saveSnapshot();
      }
    });
  </script>
</body>
</html>
